paths:
  # Main 7B protocol starts from the registered original instruct model.
  policy_model: "@workspace/models/Qwen/Qwen2.5-7B-Instruct"
  policy_adapter: null
  semantic_model: "@workspace/models/Qwen/Qwen3-Embedding-0.6B"
  skillrl_source: "@workspace/alfworld_eval/SkillRL"
  alfworld_source: "@workspace/alfworld_eval/alfworld-master"
  alfworld_data: "@workspace/data/alfworld/alfworld"
  alfworld_config: "@workspace/alfworld_eval/alfworld-master/configs/base_config.yaml"
  skill_bank: "@workspace/alfworld_eval/SkillRL/memory_data/alfworld/claude_style_skills.json"
  skill_bank_manifest: configs/alfworld_skill_bank_manifest.json
  output_root: "@workspace/alfworld_eval/infoskill/runs"
  # Legacy Transformers-only field; VERL M1 eval loads POLICY_CHECKPOINT instead.
  infoskill_checkpoint: null
  # Required for M1 training; GROUNDING_DATA may override it at launch time.
  grounding_data: null

# Selects the immutable shared 7B initialization registered in code.
# The local path may move, but training rejects any content mismatch.
policy_model_id: qwen2.5-7b-instruct

max_steps: 30
history_length: 2
max_prompt_tokens: 4096
max_response_tokens: 256

# Main setting is embedding. Change to template only for the explicit ablation.
retrieval_mode: embedding
general_top_k: 6
task_top_k: 6
mistake_count: 5

master_seed: 0
eval_batch_size: 8
