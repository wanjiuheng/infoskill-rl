paths:
  # Isolated A800 experiment using the locally pinned Qwen3-1.7B base model.
  policy_model: /root/autodl-tmp/wjh/models/Qwen/Qwen3-1.7B
  policy_adapter: null
  semantic_model: /root/autodl-tmp/wjh/models/Qwen/Qwen3-Embedding-0.6B
  skillrl_source: /root/autodl-tmp/wjh/alfworld_eval/SkillRL
  alfworld_source: /root/autodl-tmp/wjh/alfworld_eval/alfworld-master
  alfworld_data: /root/autodl-tmp/wjh/data/alfworld/alfworld
  alfworld_config: /root/autodl-tmp/wjh/alfworld_eval/alfworld-master/configs/base_config.yaml
  skill_bank: /root/autodl-tmp/wjh/alfworld_eval/SkillRL/memory_data/alfworld/claude_style_skills.json
  skill_bank_manifest: configs/alfworld_skill_bank_manifest.json
  output_root: /root/autodl-tmp/wjh/alfworld_eval/infoskill/runs
  # Legacy Transformers-only field; VERL M1 eval loads POLICY_CHECKPOINT instead.
  infoskill_checkpoint: null
  # Required for M1 training; GROUNDING_DATA may override it at launch time.
  grounding_data: null

# Pinned independently from the Qwen2.5 mainline model.
policy_model_id: qwen3-1.7b

max_steps: 30
history_length: 2
max_prompt_tokens: 4096
max_response_tokens: 256

# Keep the ALFWorld protocol identical to the Qwen2.5 comparison run.
retrieval_mode: embedding
general_top_k: 6
task_top_k: 6
mistake_count: 5

master_seed: 0
eval_batch_size: 8
